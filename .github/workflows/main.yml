name: Generate Mahadi IFAD Cert
on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  print_cert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Execute Automation
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ 
              headless: 'new', 
              args: ['--no-sandbox', '--disable-setuid-sandbox'] 
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 4000 });
            
            console.log('IFAD লিঙ্ক লোড হচ্ছে...');
            try {
              await page.goto('https://ifad.org', { 
                waitUntil: 'networkidle2',
                timeout: 120000 
              });
              
              await new Promise(r => setTimeout(r, 15000));

              console.log('পুরো পেজ স্ক্রল করা হচ্ছে...');
              await page.evaluate(async () => {
                await new Promise((resolve) => {
                  let totalHeight = 0;
                  let distance = 100;
                  let timer = setInterval(() => {
                    let scrollHeight = document.body.scrollHeight;
                    window.scrollBy(0, distance);
                    totalHeight += distance;
                    if(totalHeight >= scrollHeight){
                      clearInterval(timer);
                      resolve();
                    }
                  }, 100);
                });
              });

              await new Promise(r => setTimeout(r, 5000));

              console.log('আপনার নাম ইনপুট দেওয়া হচ্ছে...');
              const inputSelector = 'input[type=\"text\"]';
              await page.waitForSelector(inputSelector, { timeout: 30000 });
              await page.type(inputSelector, 'MD Towhidur Rahman Mahadi', { delay: 100 });
              
              console.log('বাটন ক্লিক করা হচ্ছে...');
              await page.evaluate(() => {
                const buttons = Array.from(document.querySelectorAll('button'));
                const target = buttons.find(b => b.innerText.toLowerCase().includes('print certificate'));
                if (target) {
                  target.scrollIntoView();
                  target.click();
                } else {
                  throw new Error('Print button not found!');
                }
              });
              
              await new Promise(r => setTimeout(r, 20000));
              await page.pdf({ path: 'Mahadi_IFAD_Certificate.pdf', format: 'A4', printBackground: true });
              console.log('সফলভাবে PDF তৈরি হয়েছে!');
            } catch (err) {
              console.error('সমস্যা হয়েছে:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();"

      - name: Save Certificate
        uses: actions/upload-artifact@v4
        with:
          name: IFAD_Certificate_Mahadi
          path: Mahadi_IFAD_Certificate.pdf
