name: Generate Mahadi IFAD Cert
on:
  workflow_dispatch:

jobs:
  print_cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Execute Automation
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            try {
              const browser = await puppeteer.launch({ 
                headless: 'new', 
                args: ['--no-sandbox', '--disable-setuid-sandbox'] 
              });
              const page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 2500 });
              
              const targetUrl = 'https://www.ifad.org/e-learning/FM-multilingual/en/module1/#/lessons/7q4OER2htphj-OQyrn0H0wAPI3tNaYFk';
              
              console.log('Loading page...');
              await page.goto(targetUrl, { waitUntil: 'networkidle2', timeout: 60000 });
              
              console.log('Waiting for initial load...');
              await new Promise(r => setTimeout(r, 10000));

              console.log('Scrolling to bottom...');
              await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
              await new Promise(r => setTimeout(r, 5000));

              console.log('Typing name...');
              const inputSelector = 'input[type=\"text\"]';
              await page.waitForSelector(inputSelector, { timeout: 30000 });
              await page.type(inputSelector, 'MD Towhidur Rahman Mahadi');
              
              console.log('Clicking print button...');
              await page.evaluate(() => {
                const buttons = Array.from(document.querySelectorAll('button'));
                const target = buttons.find(b => b.innerText.toLowerCase().includes('print certificate'));
                if (target) target.click();
                else throw new Error('Print button not found');
              });
              
              console.log('Generating PDF...');
              await new Promise(r => setTimeout(r, 15000));
              await page.pdf({ path: 'Mahadi_IFAD_Certificate.pdf', format: 'A4', printBackground: true });
              
              await browser.close();
              console.log('Success!');
            } catch (err) {
              console.error('Error occurred:', err.message);
              process.exit(1);
            }
          })();"

      - name: Save Certificate
        uses: actions/upload-artifact@v4
        with:
          name: IFAD_Certificate_Mahadi
          path: Mahadi_IFAD_Certificate.pdf
