name: Generate Mahadi IFAD Cert
on:
  workflow_dispatch:

jobs:
  print_cert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Puppeteer
        run: npm install puppeteer
      - name: Execute Automation
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch({ headless: 'new', args: ['--no-sandbox'] });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 2000 });
            await page.goto('https://ifad.org', { waitUntil: 'networkidle2' });
            await new Promise(r => setTimeout(r, 5000));
            await page.evaluate(async () => {
              await new Promise((resolve) => {
                let totalHeight = 0; let distance = 100;
                let timer = setInterval(() => {
                  let scrollHeight = document.body.scrollHeight;
                  window.scrollBy(0, distance); totalHeight += distance;
                  if(totalHeight >= scrollHeight){ clearInterval(timer); resolve(); }
                }, 100);
              });
            });
            await new Promise(r => setTimeout(r, 5000));
            await page.waitForSelector('input[type=\"text\"]');
            await page.type('input[type=\"text\"]', 'MD Towhidur Rahman Mahadi');
            await page.evaluate(() => {
              const buttons = Array.from(document.querySelectorAll('button'));
              const target = buttons.find(b => b.innerText.includes('Print certificate'));
              if (target) target.click();
            });
            await new Promise(r => setTimeout(r, 10000));
            await page.pdf({ path: 'Mahadi_IFAD_Certificate.pdf', format: 'A4', printBackground: true });
            await browser.close();
          })();"
      - name: Save Certificate
        uses: actions/upload-artifact@v3
        with:
          name: Download_Certificate_Here
          path: Mahadi_IFAD_Certificate.pdf
